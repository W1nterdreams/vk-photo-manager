<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- CACHE_VERSION: 20260929-client09-albumsfix -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Поиск пряжи VK</title>
    <link rel="stylesheet" href="./style.css?v=20260929-client09-albumsfix">
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
<div id="app">
    <header class="topbar">
        <button id="backButton" class="topbar-button hidden" type="button" title="Назад">←</button>

        <div id="pageTitle" class="topbar-title">Фотоальбомы</div>

        <div id="albumSortControls" class="topbar-sort-controls hidden" aria-label="Сортировка фотографий">
            <button id="sortNewestButton" class="topbar-sort-button" type="button">Новые</button>
            <button id="sortOldestButton" class="topbar-sort-button" type="button">Старые</button>
            <button id="sortCurrentButton" class="topbar-sort-button active" type="button">Текущая</button>
        </div>

        <div id="user" class="topbar-user">Загрузка...</div>
        <button id="refreshButton" class="topbar-button" type="button" title="Обновить">↻</button>
    </header>

    <main id="albumsScreen" class="screen">
        <div class="search-container client-dual-search">
            <div class="search-box">
                <span class="search-icon">▣</span>
                <input id="albumSearch" type="search" placeholder="Поиск альбомов..." autocomplete="off" spellcheck="false">
                <button id="clearAlbumSearch" class="clear-search hidden" type="button">×</button>
            </div>

            <div class="search-box client-photo-search-line">
                <span class="search-icon">🔎</span>
                <input id="globalPhotoSearch" type="search" placeholder="Поиск фотографий..." autocomplete="off" spellcheck="false">
                <button id="clearGlobalPhotoSearch" class="clear-search hidden" type="button">×</button>
            </div>

            <div id="globalSearchStatus" class="client-global-search-status hidden"></div>
        </div>

        <div id="albums" class="albums-grid">
            <div class="status-message">Загружаем альбомы...</div>
        </div>
        <div id="globalSearchResults" class="client-home-photo-results hidden"></div>
    </main>

    <main id="photosScreen" class="screen hidden">
        <section class="album-header">
            <div class="album-header-main">
                <h1 id="albumTitle">Альбом</h1>
                <div id="photoCount" class="photo-count"></div>
            </div>
            <div id="albumDescription" class="album-description"></div>
            <div class="photo-search-container">
                <div class="search-box photo-search-box">
                    <span class="search-icon">🔎</span>
                    <input id="photoSearch" type="search" placeholder="Поиск по описанию фото..." autocomplete="off" spellcheck="false">
                    <button id="clearPhotoSearch" class="clear-search hidden" type="button">×</button>
                </div>
            </div>
        </section>
        <div id="photos" class="photos-grid"><div class="status-message">Выберите альбом</div></div>
    </main>

    <main id="photoViewerScreen" class="screen hidden">
        <section class="photo-viewer-media">
            <button id="photoViewerPrev" class="photo-viewer-nav photo-viewer-nav-prev hidden" type="button" aria-label="Предыдущая фотография">‹</button>
            <img id="photoViewerImage" class="photo-viewer-image" alt="Фотография">
            <button id="photoViewerNext" class="photo-viewer-nav photo-viewer-nav-next hidden" type="button" aria-label="Следующая фотография">›</button>
        </section>

        <div id="photoViewerDescription" class="photo-viewer-description hidden"></div>
        <div id="photoViewerFreshness" class="client-photo-freshness hidden"></div>

        <div class="photo-viewer-stats">
            <div class="photo-viewer-stat"><span class="photo-viewer-stat-icon">♡</span><span id="photoViewerLikes">0</span></div>
            <div class="photo-viewer-stat"><span class="photo-viewer-stat-icon">↗</span><span id="photoViewerReposts">0</span></div>
        </div>

        <div class="client-photo-actions">
            <button id="openPhotoCommentsButton" class="primary-button client-comments-button" type="button">Перейти к комментариям</button>
        </div>
    </main>
</div>

<script type="module" src="./js/app.js?v=20260929-client09-albumsfix"></script>
</body>
</html>
