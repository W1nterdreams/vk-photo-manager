<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Фотоальбомы VK</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>

<body>

<div id="app">

    <!-- ======================================
         ВЕРХНЯЯ ПАНЕЛЬ
         ====================================== -->

    <header class="topbar">

        <button
            id="backButton"
            class="topbar-button hidden"
            type="button"
            title="Назад"
        >
            ←
        </button>

        <div class="topbar-icon">
            ▣
        </div>

        <div
            id="pageTitle"
            class="topbar-title"
        >
            Фотоальбомы
        </div>

        <div
            id="user"
            class="topbar-user"
        >
            Загрузка...
        </div>

        <button
            id="refreshAlbums"
            class="topbar-button"
            type="button"
            title="Обновить"
        >
            ↻
        </button>

    </header>


    <!-- ======================================
         ЭКРАН АЛЬБОМОВ
         ====================================== -->

    <main
        id="albumsScreen"
        class="screen"
    >

        <!-- ПОИСК -->

        <div class="search-container">

            <div class="search-box">

                <span class="search-icon">
                    🔎
                </span>

                <input
                    id="albumSearch"
                    type="search"
                    placeholder="Найти альбом..."
                    autocomplete="off"
                    spellcheck="false"
                >

                <button
                    id="clearSearch"
                    class="clear-search hidden"
                    type="button"
                    title="Очистить"
                >
                    ×
                </button>

            </div>

        </div>


        <!-- АЛЬБОМЫ -->

        <div
            id="albums"
            class="albums-grid"
        >

            <div class="status-message">
                Загружаем альбомы...
            </div>

        </div>

    </main>


    <!-- ======================================
         ЭКРАН ФОТОГРАФИЙ
         ====================================== -->

    <main
        id="photosScreen"
        class="screen hidden"
    >

        <section
            id="albumHeader"
            class="album-header"
        >

            <div class="album-header-main">

                <h1 id="albumTitle">
                    Альбом
                </h1>

                <div
                    id="photoCount"
                    class="photo-count"
                >
                </div>

            </div>

            <div
                id="albumDescription"
                class="album-description"
            >
            </div>

        </section>


        <div
            id="photos"
            class="photos-grid"
        >

            <div class="status-message">
                Выберите альбом
            </div>

        </div>

    </main>

</div>


<script src="app.js"></script>

</body>
</html>
