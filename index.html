<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- CACHE_VERSION: 20260919-nav03 -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Фотоальбомы VK</title>

    <link rel="stylesheet" href="./style.css?v=20260919-nav03">

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>

<body>

<div id="app">

    <!-- ШАПКА -->
    <header class="topbar">

        <!-- Назад -->
        <button
            id="backButton"
            class="topbar-button hidden"
            type="button"
            title="Назад"
        >
            ←
        </button>

        <!-- МЕНЮ -->
        <div
            id="menuContainer"
            class="menu-container"
        >

            <button
                id="menuButton"
                class="topbar-button menu-button"
                type="button"
                title="Меню"
            >
                ☰
            </button>

            <!-- ВЫПАДАЮЩЕЕ МЕНЮ -->
            <div
                id="mainMenu"
                class="main-menu hidden"
            >

                <button
                    id="createAlbumMenuButton"
                    class="menu-item"
                    type="button"
                >
                    <span class="menu-item-icon">＋</span>

                    <span>
                        Создать альбом
                    </span>
                </button>

                <button
                    id="commentsMenuButton"
                    class="menu-item"
                    type="button"
                >
                    <span class="menu-item-icon">💬</span>

                    <span>
                        Комментарии
                    </span>
                </button>

            </div>

        </div>


        <div
            id="pageTitle"
            class="topbar-title"
        >
            Фотоальбомы
        </div>


        <div
            id="user"
            class="topbar-user"
        >
            Загрузка...
        </div>


        <button
            id="refreshAlbums"
            class="topbar-button"
            type="button"
            title="Обновить"
        >
            ↻
        </button>

    </header>


    <!-- ==============================
         ЭКРАН АЛЬБОМОВ
         ============================== -->

    <main
        id="albumsScreen"
        class="screen"
    >

        <div class="search-container">

            <div class="search-box">

                <span class="search-icon">
                    🔎
                </span>

                <input
                    id="albumSearch"
                    type="search"
                    placeholder="Найти альбом..."
                    autocomplete="off"
                    spellcheck="false"
                >

                <button
                    id="clearSearch"
                    class="clear-search hidden"
                    type="button"
                >
                    ×
                </button>

            </div>

        </div>


        <div
            id="albums"
            class="albums-grid"
        >

            <div class="status-message">
                Загружаем альбомы...
            </div>

        </div>

    </main>


    <!-- ==============================
         ЭКРАН ФОТОГРАФИЙ
         ============================== -->

    <main
        id="photosScreen"
        class="screen hidden"
    >

        <section
            id="albumHeader"
            class="album-header"
        >

            <div class="album-header-main">

                <h1 id="albumTitle">
                    Альбом
                </h1>

                <div
                    id="photoCount"
                    class="photo-count"
                ></div>

            </div>

            <div
                id="albumDescription"
                class="album-description"
            ></div>

        </section>


        <div
            id="photos"
            class="photos-grid"
        >

            <div class="status-message">
                Выберите альбом
            </div>

        </div>

    </main>


    <!-- ==============================
         ЭКРАН КОММЕНТАРИЕВ
         ============================== -->

    <main
        id="commentsScreen"
        class="screen hidden"
    >

        <div class="comments-toolbar">

            <div class="comments-title">
                Комментарии к фотографиям
            </div>

            <button
                id="refreshComments"
                class="secondary-button"
                type="button"
            >
                ↻ Обновить
            </button>

        </div>


        <div
            id="comments"
            class="comments-list"
        >

            <div class="status-message">
                Загрузка комментариев...
            </div>

        </div>

    </main>

</div>


<!-- ==================================
     СОЗДАНИЕ АЛЬБОМА
     ================================== -->

<div
    id="createAlbumModal"
    class="modal-overlay hidden"
>

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">
                Создать альбом
            </div>

            <button
                id="closeCreateAlbum"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>


        <form id="createAlbumForm">

            <label class="form-label">
                Название
            </label>

            <input
                id="newAlbumTitle"
                class="form-input"
                type="text"
                maxlength="100"
                placeholder="Название альбома"
                required
            >


            <label class="form-label">
                Описание
            </label>

            <textarea
                id="newAlbumDescription"
                class="form-textarea"
                maxlength="1000"
                placeholder="Описание альбома"
            ></textarea>


            <div
                id="createAlbumError"
                class="form-error hidden"
            ></div>


            <div class="modal-actions">

                <button
                    id="cancelCreateAlbum"
                    class="secondary-button"
                    type="button"
                >
                    Отмена
                </button>

                <button
                    id="submitCreateAlbum"
                    class="primary-button"
                    type="submit"
                >
                    Создать
                </button>

            </div>

        </form>

    </div>

</div>


<script type="module" src="./js/app.js?v=20260919-nav03"></script>
    
</body>
</html>
