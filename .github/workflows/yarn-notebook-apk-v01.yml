name: Build Yarn Notebook APK

on:
  push:
    branches:
      - yarn-notebook-android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore base project
        shell: bash
        run: |
          cat ci/yarn-notebook-v0.2.zip.b64.part1 ci/yarn-notebook-v0.2.zip.b64.part2 > /tmp/yarn-base.b64
          base64 -d /tmp/yarn-base.b64 > /tmp/yarn-base.zip
          unzip -q /tmp/yarn-base.zip -d "$GITHUB_WORKSPACE"
          cp ci/yarn-debug.p12 yarn-notebook-android/app/yarn-debug.p12

      - name: Restore v0.2.4 sources
        shell: bash
        run: |
          for f in MainActivity.java DbHelper.java YarnRecord.java build.gradle; do
            base64 -d "ci/v024/$f.gz.b64" | gzip -dc > "/tmp/$f"
          done
          cp /tmp/MainActivity.java yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/MainActivity.java
          cp /tmp/DbHelper.java yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/DbHelper.java
          cp /tmp/YarnRecord.java yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/YarnRecord.java
          cp /tmp/build.gradle yarn-notebook-android/app/build.gradle

      - name: Apply v0.2.5 patch
        shell: bash
        run: |
          cat             ci/v025/patch.b64.part00             ci/v025/patch.b64.part01             ci/v025/patch.b64.part02             ci/v025/patch.b64.part03             ci/v025/patch.b64.part04             ci/v025/patch.b64.part05             ci/v025/patch.b64.part06 > /tmp/v025.patch.b64
          base64 -d /tmp/v025.patch.b64 > /tmp/v025.patch
          cd yarn-notebook-android
          patch -p1 < /tmp/v025.patch

      - name: Apply v0.2.6 patch
        shell: bash
        run: |
          base64 -d ci/v026/patch.b64 > /tmp/v026.patch
          cd yarn-notebook-android
          patch -p1 < /tmp/v026.patch

      - name: Apply v0.2.7 autocomplete tweak
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/MainActivity.java')
          src = p.read_text()
          old = 'db.getSuggestions(suggestionField, q, 2)'
          if old not in src:
              raise SystemExit('autocomplete limit target not found')
          p.write_text(src.replace(old, 'db.getSuggestions(suggestionField, q, 1)', 1))

          g = Path('yarn-notebook-android/app/build.gradle')
          txt = g.read_text()
          txt = txt.replace('versionCode 7', 'versionCode 8')
          txt = txt.replace("versionName '0.2.6'", "versionName '0.2.7'")
          g.write_text(txt)
          PY

      - name: Apply v0.2.8 layout description patch
        shell: bash
        run: |
          base64 -d ci/v028/patch.b64 > /tmp/v028.patch
          cd yarn-notebook-android
          patch -p1 < /tmp/v028.patch

      - name: Apply v0.2.9 autocomplete height fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/MainActivity.java')
          src = p.read_text()
          old = 'e.setDropDownHeight(dp(100));'
          if old not in src:
              raise SystemExit('autocomplete dropdown height target not found')
          p.write_text(src.replace(old, 'e.setDropDownHeight(ViewGroup.LayoutParams.WRAP_CONTENT);', 1))

          g = Path('yarn-notebook-android/app/build.gradle')
          txt = g.read_text()
          txt = txt.replace('versionCode 9', 'versionCode 10')
          txt = txt.replace("versionName '0.2.8'", "versionName '0.2.9'")
          g.write_text(txt)
          PY

      - name: Apply v0.2.10 launcher icon
        shell: bash
        run: |
          mkdir -p yarn-notebook-android/app/src/main/res/mipmap-xxxhdpi
          cp ci/v0210/app_icon.webp yarn-notebook-android/app/src/main/res/mipmap-xxxhdpi/app_icon.webp

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path('yarn-notebook-android/app/src/main/AndroidManifest.xml')
          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find('application')
          if app is None:
              raise SystemExit('application tag not found')
          app.set(f'{{{android_ns}}}icon', '@mipmap/app_icon')
          app.set(f'{{{android_ns}}}roundIcon', '@mipmap/app_icon')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          gradle = Path('yarn-notebook-android/app/build.gradle')
          text = gradle.read_text()
          if 'versionCode 10' not in text or "versionName '0.2.9'" not in text:
              raise SystemExit('expected v0.2.9 version not found')
          text = text.replace('versionCode 10', 'versionCode 11')
          text = text.replace("versionName '0.2.9'", "versionName '0.2.10'")
          gradle.write_text(text)
          PY

      - name: Apply v0.2.11 app name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path('yarn-notebook-android/app/src/main/AndroidManifest.xml')
          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find('application')
          if app is None:
              raise SystemExit('application tag not found')
          app.set(f'{{{android_ns}}}label', 'Моя пряжа')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          gradle = Path('yarn-notebook-android/app/build.gradle')
          text = gradle.read_text()
          if 'versionCode 11' not in text or "versionName '0.2.10'" not in text:
              raise SystemExit('expected v0.2.10 version not found')
          text = text.replace('versionCode 11', 'versionCode 12')
          text = text.replace("versionName '0.2.10'", "versionName '0.2.11'")
          gradle.write_text(text)
          PY

      - name: Apply v0.2.12 calculator tag
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/MainActivity.java')
          src = p.read_text()
          old = '''StringBuilder b = new StringBuilder();
        addLine(b, "Страна", r.country);'''
          new = '''StringBuilder b = new StringBuilder();
        b.append("#Калькулятор\\n\\n");
        addLine(b, "Страна", r.country);'''
          if old not in src:
              raise SystemExit('VK text builder target not found')
          p.write_text(src.replace(old, new, 1))

          g = Path('yarn-notebook-android/app/build.gradle')
          txt = g.read_text()
          if 'versionCode 12' not in txt or "versionName '0.2.11'" not in txt:
              raise SystemExit('expected v0.2.11 version not found')
          txt = txt.replace('versionCode 12', 'versionCode 13')
          txt = txt.replace("versionName '0.2.11'", "versionName '0.2.12'")
          g.write_text(txt)
          PY

      - name: Build debug APK
        working-directory: yarn-notebook-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK certificate
        shell: bash
        run: keytool -printcert -jarfile yarn-notebook-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moya-pryazha-v0.2.12-debug-apk
          path: yarn-notebook-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
