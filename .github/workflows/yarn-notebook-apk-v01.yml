name: Build Yarn Notebook APK

on:
  push:
    branches:
      - yarn-notebook-android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore Android project
        shell: bash
        run: |
          cat ci/yarn-notebook-v0.2.zip.b64.part1 ci/yarn-notebook-v0.2.zip.b64.part2 > /tmp/yarn-notebook.zip.b64
          base64 -d /tmp/yarn-notebook.zip.b64 > /tmp/yarn-notebook.zip
          unzip -q /tmp/yarn-notebook.zip -d "$GITHUB_WORKSPACE"
          cp ci/yarn-debug.p12 yarn-notebook-android/app/yarn-debug.p12
          cp ci/yarn-build.gradle yarn-notebook-android/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          p = Path('yarn-notebook-android/app/src/main/java/ru/yarnnotebook/app/MainActivity.java')
          s = p.read_text()
          s = s.replace('import android.view.WindowInsetsController;\n', '')
          old = '''        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
              WindowInsetsController controller = getWindow().getInsetsController();
              if (controller != null) {
                  controller.setSystemBarsAppearance(
                          WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS,
                          WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS |
                                  WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS);
              }
          }
          '''
          if old not in s:
              raise SystemExit('WindowInsetsController block not found')
          p.write_text(s.replace(old, ''))
          PY

      - name: Build debug APK
        working-directory: yarn-notebook-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK certificate
        shell: bash
        run: keytool -printcert -jarfile yarn-notebook-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yarn-notebook-v0.2.1-debug-apk
          path: yarn-notebook-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
